name: Viper Core
version: "0.4.2"
slug: viper_core
description: Always-on Viper event engine for Home Assistant
url: https://github.com/corykad/viper-core-addon
arch:
  - aarch64
  - amd64
startup: services
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:snake
panel_title: Viper Core
hassio_api: true
# Supervisor requires manager access to read another add-on's logs.
hassio_role: manager
homeassistant_api: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Viper Core health and setup page
map:
  - media:rw
options:
  matterbridge_addon_slug: "246dd49f_matterbridge"
  log_level: info
  health_check_seconds: 60
  enabled_features:
    doorbell: true
    fridge: false
    vacuum: false
    hvac: false
    ice_maker: false
  notification_service: persistent_notification.create
  tts_service: tts.google_say
  tts_targets: []
  direct_sonos_targets: []
  alexa_notify_service: notify.alexa_media
  alexa_targets: []
  doorbell_speaker_service: ""
  fridge_speaker_service: ""
  vacuum_speaker_service: ""
  pushover_service: ""
  pushover_user_key: ""
  pushover_api_token: ""
  speaker_targets: []
  external_base_url: ""
  gemini_api_key: ""
  openai_api_key: ""
  gemini_vision_model: gemini-3.5-flash
  openai_vision_model: gpt-6-astra
  smartthings_config_entry_id: ""
  fridge_stale_auto_repair: false
  fallback_ha_url: ""
  fallback_ha_token: ""
schema:
  matterbridge_addon_slug: str
  log_level: list(trace|debug|info|warning|error)
  health_check_seconds: int(15,3600)
  enabled_features:
    doorbell: bool
    fridge: bool
    vacuum: bool
    hvac: bool
    ice_maker: bool
  notification_service: str?
  tts_service: str?
  tts_targets:
    - match(^.*$)
  direct_sonos_targets:
    - match(^.*$)
  alexa_notify_service: str?
  alexa_targets:
    - match(^.*$)
  doorbell_speaker_service: str?
  fridge_speaker_service: str?
  vacuum_speaker_service: str?
  pushover_service: str?
  pushover_user_key: password?
  pushover_api_token: password?
  speaker_targets:
    - match(^.*$)
  external_base_url: str?
  gemini_api_key: password?
  openai_api_key: password?
  gemini_vision_model: str?
  openai_vision_model: str?
  smartthings_config_entry_id: str?
  fridge_stale_auto_repair: bool
  fallback_ha_url: str?
  fallback_ha_token: str?
