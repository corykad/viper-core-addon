name: Check add-on
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build app
        run: >-
          docker buildx build --load --platform ${{ matrix.platform }}
          --build-arg BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:latest
          --tag viper-core:test ./viper_core
      - name: Check clean install inside image
        run: >-
          docker run --rm --platform ${{ matrix.platform }} --entrypoint python3
          -v "$PWD/tests:/tests:ro" viper-core:test /tests/test_clean_install.py
