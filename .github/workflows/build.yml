name: Check add-on
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  container:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Build app
        run: |
          BUILD_FROM=$(awk '$1 == "${{ matrix.arch }}:" { print $2 }' viper_core/build.yaml)
          [[ "$BUILD_FROM" == */*/* ]] || { echo "Supervisor requires a fully qualified build_from image"; exit 1; }
          docker buildx build --load --platform ${{ matrix.platform }} \
            --build-arg BUILD_FROM="$BUILD_FROM" --tag viper-core:test ./viper_core
      - name: Check clean install inside image
        run: >-
          docker run --rm --platform ${{ matrix.platform }} --entrypoint python3
          -v "$PWD/tests:/tests:ro" viper-core:test -m unittest discover -s /tests
